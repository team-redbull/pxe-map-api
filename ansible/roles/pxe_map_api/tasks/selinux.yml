---
# Same as SPEC.md §5 / the old deploy/install.sh: a one-time persistent
# fcontext rule so the label survives reboots, then restorecon to apply it
# to whatever's already there. The per-write restorecon in
# app/mapping.py:write_mapping keeps every new file labeled correctly after
# this. Never disables SELinux or loosens permissions - do not add a
# setenforce/permissive task here.
- name: Register persistent SELinux file context for PXE_MAP_DIR (httpd_sys_content_t)
  community.general.sefcontext:
    target: "{{ pxe_map_api_dir }}(/.*)?"
    setype: httpd_sys_content_t
    state: present
  when: ansible_facts.selinux.status | default('disabled') == 'enabled'

- name: Apply the SELinux context to files already in PXE_MAP_DIR
  ansible.builtin.command:
    cmd: restorecon -Rv {{ pxe_map_api_dir | quote }}
  register: _pxe_map_api_restorecon
  changed_when: _pxe_map_api_restorecon.stdout != ""
  when: ansible_facts.selinux.status | default('disabled') == 'enabled'
