---
- name: Create the app directory
  ansible.builtin.file:
    path: "{{ pxe_map_api_app_dir }}"
    state: directory
    owner: "{{ pxe_map_api_user }}"
    group: "{{ pxe_map_api_group }}"
    mode: "0755"

- name: Copy application code
  ansible.builtin.copy:
    src: "{{ pxe_map_api_src_dir }}/app/"
    dest: "{{ pxe_map_api_app_dir }}/app/"
    owner: "{{ pxe_map_api_user }}"
    group: "{{ pxe_map_api_group }}"
    mode: "0644"
    directory_mode: "0755"
  notify: Restart pxe-map-api

- name: Copy requirements.txt
  ansible.builtin.copy:
    src: "{{ pxe_map_api_src_dir }}/requirements.txt"
    dest: "{{ pxe_map_api_app_dir }}/requirements.txt"
    owner: "{{ pxe_map_api_user }}"
    group: "{{ pxe_map_api_group }}"
    mode: "0644"
  notify: Restart pxe-map-api

- name: Create the venv and install dependencies from the local mirror (air-gapped, no PyPI)
  ansible.builtin.pip:
    requirements: "{{ pxe_map_api_app_dir }}/requirements.txt"
    virtualenv: "{{ pxe_map_api_venv_dir }}"
    virtualenv_command: python3 -m venv
    extra_args: "--no-index --find-links={{ pxe_map_api_local_mirror }}"
  notify: Restart pxe-map-api

- name: Own the app directory (including the venv just created as root)
  ansible.builtin.file:
    path: "{{ pxe_map_api_app_dir }}"
    owner: "{{ pxe_map_api_user }}"
    group: "{{ pxe_map_api_group }}"
    recurse: true
