---
- name: Create the config directory
  ansible.builtin.file:
    path: "{{ pxe_map_api_config_dir }}"
    state: directory
    owner: root
    group: "{{ pxe_map_api_group }}"
    mode: "0750"

- name: Render the environment file (PXE_MAP_DIR / PXE_MAP_BIND / PXE_MAP_TOKEN)
  ansible.builtin.template:
    src: env.j2
    dest: "{{ pxe_map_api_config_dir }}/env"
    owner: root
    group: "{{ pxe_map_api_group }}"
    mode: "0640"
  notify: Restart pxe-map-api

- name: Install the systemd unit
  ansible.builtin.template:
    src: pxe-map-api.service.j2
    dest: /etc/systemd/system/pxe-map-api.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart pxe-map-api

- name: Flush handlers now so the unit/env changes above take effect before we assert the service is up
  ansible.builtin.meta: flush_handlers

- name: Enable and start pxe-map-api
  ansible.builtin.systemd:
    name: pxe-map-api
    enabled: true
    state: started
    daemon_reload: true
