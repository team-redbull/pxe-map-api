---
# Order matters: a queued "restart" must run after a queued "reload
# systemd" at flush time, and Ansible runs triggered handlers in the order
# they're defined here (not the order they were notified) - so "reload
# systemd" stays first.
- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true

- name: Restart pxe-map-api
  ansible.builtin.systemd:
    name: pxe-map-api
    state: restarted
