---
# Replace these 5 placeholder hostnames with the real per-site PXE VMs
# (hostname or IP - whatever `ansible_host` needs to reach each one over
# SSH). Each site gets its own host_vars/<name>/ directory for its token
# and any per-site overrides (see host_vars/pxe-site1/ for the pattern).
all:
  children:
    pxe_map_api_sites:
      hosts:
        pxe-site1:
          ansible_host: pxe-site1.example.com
        pxe-site2:
          ansible_host: pxe-site2.example.com
        pxe-site3:
          ansible_host: pxe-site3.example.com
        pxe-site4:
          ansible_host: pxe-site4.example.com
        pxe-site5:
          ansible_host: pxe-site5.example.com
